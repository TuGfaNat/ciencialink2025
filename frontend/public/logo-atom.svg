<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="clBgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00529C"/>
      <stop offset="100%" stop-color="#132F42"/>
    </radialGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#clBgGradient)" stroke="#00529C" stroke-width="2"/>
  
  <!-- Atom Orbits -->
  <!-- Horizontal Orbit -->
  <ellipse cx="100" cy="100" rx="72" ry="26" stroke="#FFFFFF" stroke-width="4.5" fill="none" transform="rotate(0 100 100)"/>
  <!-- Diagonal Orbit 60 deg -->
  <ellipse cx="100" cy="100" rx="72" ry="26" stroke="#FFFFFF" stroke-width="4.5" fill="none" transform="rotate(60 100 100)"/>
  <!-- Diagonal Orbit 120 deg -->
  <ellipse cx="100" cy="100" rx="72" ry="26" stroke="#FFFFFF" stroke-width="4.5" fill="none" transform="rotate(120 100 100)"/>
  
  <!-- Nucleus -->
  <circle cx="100" cy="100" r="16" fill="#FFFFFF"/>
  
  <!-- Bolivian Flag Colored Electrons on Orbits -->
  <!-- Red electron (top-left) -->
  <circle cx="50" cy="65" r="7.5" fill="#F80034" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Yellow electron (bottom) -->
  <circle cx="98" cy="144" r="7.5" fill="#FFD100" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Green electron (bottom-right / side) -->
  <circle cx="152" cy="74" r="7.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
