version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ciencialink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ciencialink
      POSTGRES_PASSWORD: ciencialink_secret_pass_2026
      POSTGRES_DB: ciencialink
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ciencialink-backend
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=production
      - FRONTEND_URL=*
      - DATABASE_URL=postgres://ciencialink:ciencialink_secret_pass_2026@db:5432/ciencialink
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 384M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ciencialink-frontend
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
